<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncle Sim PCN Cyclist</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0f14;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;overflow:hidden}

/* ── Desktop layout ── */
#wrap{position:relative;width:900px;max-width:100vw}
canvas{display:block;width:100%;height:auto;border-radius:6px;cursor:pointer;box-shadow:0 0 60px rgba(74,180,74,0.25),0 0 120px rgba(74,180,74,0.08)}
#btns{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.btn{background:rgba(20,28,38,.82);color:#f8f4ec;border:1.5px solid rgba(255,255,255,.2);border-radius:8px;padding:12px 22px;font-size:17px;font-family:'Courier New',monospace;cursor:pointer;user-select:none;touch-action:none;transition:background .1s}
@media (orientation:portrait) and (max-width:600px){
  #btns{gap:5px;}
  .btn{padding:7px 11px;font-size:12px;background:rgba(20,28,38,.38);border-color:rgba(255,255,255,.15);}
  .btn:active,.btn.held{background:rgba(60,80,100,.6);}
  #tip{display:block;}
}
#tip{
  display:none;
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  z-index:50;
  background:rgba(10,15,20,0.88);
  color:#4acd4a;
  font-family:'Courier New',monospace;font-size:12px;
  padding:8px 16px;border-radius:20px;
  border:1px solid rgba(74,205,74,0.4);
  white-space:nowrap;pointer-events:none;
  animation:tipFade 6s ease-in-out forwards;
}
@keyframes tipFade{0%{opacity:0;}12%{opacity:1;}72%{opacity:1;}100%{opacity:0;}}
.btn:active,.btn.held{background:rgba(60,80,100,.9);border-color:rgba(255,255,255,.5)}
.brk{color:#ff5555;border-color:rgba(255,85,85,.4)}
.bst{color:#e8a030;border-color:rgba(232,160,48,.4)}

/* ── Mobile landscape: side-strip controls in the black bars beside canvas ── */
#sideL,#sideR{display:none;}
@media (orientation:landscape) and (max-height:500px){
  html,body{flex-direction:row;align-items:stretch;height:100svh;overflow:hidden;}
  #sideL,#sideR{
    display:flex;flex-direction:column;
    flex:1;min-width:0;
    background:#0a0f14;
  }
  #wrap{flex:0 0 auto;height:100svh;width:auto;position:relative;}
  canvas{height:100svh;width:auto;border-radius:0;display:block;}
  #btns{display:none;}
}
/* Side-strip buttons */
.mc{
  flex:1;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:'Courier New',monospace;font-weight:bold;font-size:12px;
  line-height:1.3;text-align:center;color:#f8f4ec;
  background:rgba(255,255,255,0.04);
  border:none;outline:none;
  cursor:pointer;user-select:none;touch-action:none;
  transition:background .08s;
}
.mc svg{width:28px;height:28px;display:block;}
.mc:active,.mc.held{background:rgba(60,90,130,0.5);}
/* Divider between the two buttons in each strip */
#mcUp{border-bottom:1px solid rgba(255,255,255,0.08);}
#mcBo{border-bottom:1px solid rgba(255,255,255,0.08);color:#e8a030;}
#mcBo:active,#mcBo.held{background:rgba(80,50,10,0.5);}
#mcBk{color:#ff5555;}
#mcBk:active,#mcBk.held{background:rgba(80,15,15,0.5);}
</style>
<!-- Left strip: lane controls -->
<div id="sideL">
  <button id="mcUp" class="mc">
    <svg viewBox="0 0 28 28" fill="none"><polyline points="4,20 14,8 24,20" stroke="#f8f4ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    LANE UP
  </button>
  <button id="mcDn" class="mc">
    <svg viewBox="0 0 28 28" fill="none"><polyline points="4,8 14,20 24,8" stroke="#f8f4ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    LANE DOWN
  </button>
</div>
<div id="wrap">
  <canvas id="c" width="900" height="540"></canvas>
  <!-- Desktop / portrait bottom controls -->
  <div id="btns">
    <button id="bUp" class="btn">LANE UP</button>
    <button id="bDn" class="btn">LANE DOWN</button>
    <button id="bBk" class="btn brk">SLOW DOWN</button>
    <button id="bBo" class="btn bst">GO FASTER</button>
  </div>
</div>
<!-- Right strip: speed controls -->
<div id="sideR">
  <button id="mcBo" class="mc">
    <svg viewBox="0 0 28 28" fill="none"><polyline points="4,8 16,14 4,20" stroke="#e8a030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="13,8 25,14 13,20" stroke="#e8a030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    GO FASTER
  </button>
  <button id="mcBk" class="mc">
    <svg viewBox="0 0 28 28" fill="none"><rect x="5" y="7" width="7" height="14" rx="1.5" fill="#ff5555"/><rect x="16" y="7" width="7" height="14" rx="1.5" fill="#ff5555"/></svg>
    SLOW DOWN
  </button>
</div>
<script>
'use strict';
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=900,H=540;

// ── Layout ──────────────────────────────────────────────
const RT=218,RB=448,RH=RB-RT; // road top/bottom/height
const LH=RH/3;                 // lane height ≈76
const LY=[RT+LH*.5,RT+LH*1.5,RT+LH*2.5]; // lane centres
const PX=185;                  // player fixed x

// ── Palette ─────────────────────────────────────────────
const P={
  sky0:'#6aafd4',sky1:'#a8d4ee',sky2:'#cce8f6',
  cloud:'rgba(255,255,255,0.82)',
  hdb:['#a0c49a','#b2cce0','#ead49a','#ddb8a8','#aeccd8','#c8ddc0'],
  treeD:'#1a5020',treeM:'#2e7830',treeL:'#46a840',
  palm:'#7a5c14',
  canalW:'#b0c8b4',canalSurf:'#4e8898',canalWall:'#a8a090',
  grass:'#3a7820',
  road:'#cac2a0',roadS:'#b8b090',
  lnDiv:'rgba(255,255,255,0.22)',
  markR:'rgba(210,45,45,0.12)',
  lampP:'#908050',lampG:'rgba(255,255,160,0.9)',
  signBg:'#1a6030',
  skin:'#c89070',skinD:'#a87050',
  hair:'#181010',
  shirt:'#252538',
  bag:'#5a6368',bagS:'#7a8390',
  bkF:'#888',bkW:'#404040',
  uiBg:'rgba(10,15,20,0.8)',
  acc:'#e8a030',grn:'#4acd4a',red:'#ff5555',wht:'#f8f4ec',
  catO:'#d08020',catS:'#b06010',
  jogR:'#cc3030',jogS:'#e8e8e8',
  cycB:'#2255cc',
  ped:'#256025',
};

// ── State ────────────────────────────────────────────────
let st='title',lives=3,dist=0,score=0,lvl=0,flash=0,t=0,dt=0,last=0,env_x=0;
let bSpeed=180,gSpeed=180,spawnT=0,spawnI=2.8;
// Weather
let weather='clear'; // 'clear' | 'rain'
let weatherTimer=20+Math.random()*20; // seconds until next change
let rainIntensity=0; // 0-1, fades in/out
let rainDrops=[];    // active rain particle positions
const DESTS=[
  {name:'Bishan Park',d:1800},
  {name:'MacRitchie Reservoir',d:3200},
  {name:'Marina Barrage',d:5000},
  {name:'East Coast Park',d:7500},
];
// Testing shortcut: open with ?lvl=3 (0-indexed, see DESTS above) to jump straight
// to a level from the title screen — e.g. uncle_sim_pcn.html?lvl=3 for East Coast Park.
(function(){
  const q=new URLSearchParams(location.search).get('lvl');
  const n=parseInt(q,10);
  if(!isNaN(n)&&n>=0&&n<DESTS.length)lvl=n;
})();

// ── Input ─────────────────────────────────────────────────
const K={};

function handleAction(){
  if(st==='title'||st==='over')startGame();
  else if(st==='win')nextLvl();
}

window.addEventListener('keydown',e=>{
  K[e.key]=1;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(e.key===' '||e.key==='Enter')handleAction();
});
window.addEventListener('keyup',e=>{delete K[e.key];});

// Canvas click/tap = start or action
document.getElementById('c').addEventListener('click',handleAction);
document.getElementById('c').addEventListener('touchend',e=>{e.preventDefault();handleAction();},{passive:false});

// On-screen buttons
function btnHold(key,el){
  const set=(v)=>{if(v)K[key]=1;else delete K[key];el.classList.toggle('held',!!v);};
  el.addEventListener('mousedown',e=>{e.preventDefault();set(1);});
  el.addEventListener('touchstart',e=>{e.preventDefault();set(1);},{passive:false});
  el.addEventListener('mouseup',()=>set(0));
  el.addEventListener('mouseleave',()=>set(0));
  el.addEventListener('touchend',e=>{e.preventDefault();set(0);},{passive:false});
  el.addEventListener('touchcancel',()=>set(0));
}
btnHold('ArrowUp',document.getElementById('bUp'));
btnHold('ArrowDown',document.getElementById('bDn'));
btnHold(' ',document.getElementById('bBk'));
btnHold('ArrowRight',document.getElementById('bBo'));
// Mobile corner controls — same key bindings
btnHold('ArrowUp',document.getElementById('mcUp'));
btnHold('ArrowDown',document.getElementById('mcDn'));
btnHold(' ',document.getElementById('mcBk'));
btnHold('ArrowRight',document.getElementById('mcBo'));
// Any touch anywhere advances game state when not playing (start / next level / restart)
document.addEventListener('touchend',()=>{if(st!=='playing')handleAction();},{passive:true});

// ── Player ────────────────────────────────────────────────
const pl={
  lane:1,y:LY[1],ty:LY[1],
  velM:0,pedA:0,wob:0,lnCD:0,inv:0,hop:0,shieldT:0,healT:0,
  reset(){this.lane=1;this.y=this.ty=LY[1];this.velM=this.pedA=this.wob=this.lnCD=this.inv=this.hop=this.shieldT=this.healT=0;},
  update(dt){
    this.lnCD=Math.max(0,this.lnCD-dt);
    this.inv=Math.max(0,this.inv-dt);
    this.shieldT=Math.max(0,this.shieldT-dt);
    this.healT=Math.max(0,this.healT-dt);
    this.hop=Math.max(0,this.hop-dt*1.8);
    if(this.lnCD<=0){
      if((K.ArrowUp||K.w||K.W)&&this.lane>0){this.lane--;this.lnCD=.22;}
      if((K.ArrowDown||K.s||K.S)&&this.lane<2){this.lane++;this.lnCD=.22;}
    }
    this.ty=LY[this.lane];
    this.y+=(this.ty-this.y)*Math.min(1,dt*11);
    const boost=K.ArrowRight||K.d||K.D;
    const brake=K[' ']||K.x||K.X;
    if(boost)this.velM=Math.min(.9,this.velM+dt*2.4);
    else if(brake)this.velM=Math.max(-.6,this.velM-dt*2.5);
    else this.velM+=(0-this.velM)*dt*1.8;
    this.pedA+=dt*(4+gSpeed/70)*(1+this.velM*.5);
    this.wob=Math.max(0,this.wob-dt*2.5);
  },
  hopY(){return this.hop>0?Math.sin(this.hop*Math.PI)*(-26):0;},
  hit(amt=1){
    if(this.inv>0)return false;
    this.wob=1.4;flash=.7;this.inv=amt>=1?2.2:1.3;
    lives-=amt;addFx(PX,this.y,'hit');
    return true;
  },
  box(){return{x:PX-22,y:this.y-26,w:50,h:52};}
};

// ── Particles ─────────────────────────────────────────────
let fx=[];
function addFx(x,y,type){
  if(type==='hit'){
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2,s=60+Math.random()*110;
      fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:.6+Math.random()*.3,ml:.9,r:2+Math.random()*4,
        col:Math.random()<.5?'#ff8800':'#ffcc00'});
    }
  }
  if(type==='bump'){
    // Small yellow star burst upward
    for(let i=0;i<8;i++){
      const a=-Math.PI/2+(Math.random()-.5)*Math.PI*.8;
      const s=40+Math.random()*60;
      fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:.5,ml:.5,r:3+Math.random()*3,col:'#ffee00'});
    }
    // "BUMP!" text float
    fx.push({x,y:y-20,vx:0,vy:-40,life:.9,ml:.9,r:0,col:'#fff',text:'BUMP!'});
  }
  if(type==='powerup'){
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2,s=50+Math.random()*90;
      fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,
        life:.7+Math.random()*.3,ml:1,r:2+Math.random()*3,
        col:Math.random()<.5?'#8a5a3a':'#ffd8e8'});
    }
    fx.push({x,y:y-24,vx:0,vy:-45,life:1,ml:1,r:0,col:'#ffd83a',text:'+BOOST!'});
  }
  if(type==='heal'){
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2,s=40+Math.random()*80;
      fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,
        life:.7+Math.random()*.3,ml:1,r:2+Math.random()*3,col:'#ff5a78'});
    }
    fx.push({x,y:y-24,vx:0,vy:-45,life:1,ml:1,r:0,col:'#ff8aa0',text:'+1 HEART'});
  }
}
function updFx(dt){
  fx=fx.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;return p.life>0;});
}
function drawFx(){
  fx.forEach(p=>{
    cx.globalAlpha=p.life/p.ml;
    cx.fillStyle=p.col;
    if(p.text){
      cx.font='bold 14px Courier New';cx.textAlign='center';
      cx.fillText(p.text,p.x,p.y);cx.textAlign='left';
    } else {
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    }
  });
  cx.globalAlpha=1;
}

// ── Environment objects ───────────────────────────────────
let blds=[],trees=[],lamps=[];

function initEnv(){
  blds=[];trees=[];lamps=[];
  let bx=0;
  while(bx<W+400){
    blds.push({x:bx,col:P.hdb[blds.length%P.hdb.length],
      w:70+Math.random()*70,h:110+Math.random()*90,
      fl:6+Math.floor(Math.random()*10),wc:3+Math.floor(Math.random()*3)});
    bx+=50+Math.random()*70;
  }
  let tx=-100;
  while(tx<W+200){
    trees.push({x:tx,palm:Math.random()<.3,sc:.7+Math.random()*.6});
    tx+=70+Math.random()*130;
  }
  let lx=80;
  while(lx<W+200){lamps.push({x:lx,sign:Math.random()<.5});lx+=180+Math.random()*120;}
}

function updEnv(dt){
  const spd=effSpeed();
  // HDB parallax 0.12x
  blds.forEach(b=>b.x-=spd*.12*dt);
  const maxB=Math.max(...blds.map(b=>b.x+b.w));
  if(maxB<W+80){
    let x=maxB+20;
    for(let i=0;i<4;i++){
      blds.push({x,col:P.hdb[Math.floor(Math.random()*P.hdb.length)],
        w:70+Math.random()*70,h:110+Math.random()*90,
        fl:6+Math.floor(Math.random()*10),wc:3+Math.floor(Math.random()*3)});
      x+=50+Math.random()*70;
    }
  }
  if(blds.length>30&&blds[0].x+blds[0].w<-60)blds.shift();
  // Trees 0.3x
  trees.forEach(t=>t.x-=spd*.3*dt);
  const maxT=Math.max(...trees.map(t=>t.x));
  if(maxT<W+60)trees.push({x:maxT+70+Math.random()*130,palm:Math.random()<.3,sc:.7+Math.random()*.6});
  if(trees.length>22&&trees[0].x<-180)trees.shift();
  // Lamps 1x
  lamps.forEach(l=>l.x-=spd*dt);
  const maxL=Math.max(...lamps.map(l=>l.x));
  if(maxL<W+60)lamps.push({x:maxL+180+Math.random()*120,sign:Math.random()<.5});
  if(lamps.length>14&&lamps[0].x<-60)lamps.shift();
  env_x+=spd*dt;
}

function effSpeed(){return gSpeed*(1+pl.velM*.65);}

// ── Obstacles ─────────────────────────────────────────────
let obs=[];
const OTYPES=['jogger','pedestrian','cat','cyclist','barrier','puddle','speedbump','monkey','kite','oncoming','crab','otter'];
const OLIMITS={jogger:0,pedestrian:0,cat:200,cyclist:230,barrier:260,puddle:0,speedbump:0,monkey:0,kite:0,oncoming:0,crab:0,otter:0};
// Small/glancing hazards cost half a heart; person/vehicle/specialty hazards cost a full heart.
// (puddle-at-speed is handled separately since it also has its own velocity condition.)
const HALF_HEART_TYPES=new Set(['cat','crab','poop']);

function spawnObs(){
  let avail=OTYPES.filter(tp=>{
    if(gSpeed<OLIMITS[tp])return false;
    if(tp==='monkey'&&lvl<1)return false;
    if(tp==='kite'&&lvl<2)return false;
    if(tp==='oncoming'&&(lvl<2||Math.random()<.7))return false; // rare — only ~30% of eligible spawns even offer it
    if((tp==='crab'||tp==='otter')&&lvl<3)return false; // beach hazards only at East Coast
    return true;
  });
  if(weather==='rain') avail=[...avail,'puddle','puddle','puddle'];
  if(lvl===1||lvl===2) avail=[...avail,'monkey','speedbump'];
  if(lvl===2) avail=[...avail,'kite','oncoming']; // kept minimal again at East Coast
  if(lvl===3) avail=[...avail,'crab','crab','otter'];
  const tp=avail[Math.floor(Math.random()*avail.length)];
  let lane=Math.floor(Math.random()*3);
  const dim={
    jogger:{w:22,h:52},pedestrian:{w:22,h:50},
    cat:{w:32,h:22},cyclist:{w:58,h:62},
    barrier:{w:38,h:58},puddle:{w:65,h:28},
    speedbump:{w:70,h:18},monkey:{w:28,h:38},kite:{w:34,h:34},
    oncoming:{w:58,h:62},crab:{w:34,h:22},
    otter:{w:72,h:(RH/3)*2},
  }[tp];
  let oy;
  if(tp==='kite'){oy=LY[1];}
  else if(tp==='otter'){
    // Family runs across two adjacent lanes — leaves only the third lane free
    const startLane=Math.random()<.5?0:1;
    lane=startLane;
    oy=(LY[startLane]+LY[startLane+1])/2;
  } else {
    oy=LY[lane];
  }
  const startX = W+90; // all obstacles spawn from right
  obs.push({
    tp,lane,x:startX,y:oy,
    w:dim.w,h:dim.h,
    vx:{jogger:-55,pedestrian:-25,cat:0,cyclist:-35,barrier:0,puddle:0,
        speedbump:0,monkey:-20,kite:40,oncoming:200,
        crab:0,otter:-25}[tp],
    anim:Math.random()*10,
    cdir:Math.random()<.5?-1:1,ctimer:1+Math.random()*2,
    wide:tp==='pedestrian'&&Math.random()<.25,
    jumpTimer:0.8+Math.random()*1.4,
    kiteBaseY: LY[1],
    kiteSweep: RH*0.85,
    kiteFreq: 0.45+Math.random()*.35, // slightly slower sweep than before
    kitePhase: Math.random()*Math.PI*2,
    kiteTailAng: 0,
  });
}

function updObs(dt){
  const spd=effSpeed();
  obs=obs.filter(o=>{
    o.anim+=dt*3;
    o.x-=(spd+o.vx)*dt;
    if(o.tp==='cat'){
      o.ctimer-=dt;
      if(o.ctimer<0){
        o.y+=o.cdir*85*dt;
        if(o.y<LY[0]-30){o.y=LY[0]-30;o.cdir=1;}
        if(o.y>LY[2]+30){o.y=LY[2]+30;o.cdir=-1;}
      }
    }
    if(o.tp==='monkey'){
      o.jumpTimer-=dt;
      if(o.jumpTimer<0){
        o.lane=Math.floor(Math.random()*3);
        o.y=LY[o.lane];
        o.jumpTimer=0.6+Math.random()*1.2;
        o.anim=0;
      }
    }
    if(o.tp==='poop'&&o.fallTargetY!==undefined){
      o.y=Math.min(o.fallTargetY,o.y+240*dt);
    }
    if(o.tp==='kite'){
      // Kite sweeps up and down through all lanes — hard to predict
      o.kitePhase+=dt*o.kiteFreq*Math.PI*2;
      const sweep=Math.sin(o.kitePhase)*o.kiteSweep*.5;
      o.y=o.kiteBaseY+sweep;
      // Tilt tail based on vertical movement direction
      o.kiteTailAng=Math.cos(o.kitePhase)*0.5;
    }
    if(o.x<-120)return false;
    // Collision
    const pb=pl.box();
    const m=9;
    const ow=o.wide?o.w*1.5:o.w;
    if(pb.x+m<o.x+ow/2&&pb.x+pb.w-m>o.x-ow/2&&
       pb.y+m<o.y+o.h/2&&pb.y+pb.h-m>o.y-o.h/2){
      if(o.tp==='speedbump'){
        if(pl.hop<=0){
          pl.hop=1;
          pl.velM=Math.max(-.3,pl.velM-.5);
          pl.wob=Math.max(pl.wob,.6);
          addFx(PX,pl.y,'bump');
        }
        return true;
      }
      if(pl.inv<=0){
        if(o.tp==='puddle'){
          if(pl.velM>.4){
            const hit=pl.hit(0.5); // just a skid — half heart
            if(hit&&lives<=0){st='over';}
            return !hit;
          } else {
            pl.wob=Math.max(pl.wob,.7);pl.velM=Math.min(pl.velM,-.2);return false;
          }
        }
        // Small/glancing hazards cost half a heart; everything else is a full hit
        const amt=HALF_HEART_TYPES.has(o.tp)?0.5:1;
        const hit=pl.hit(amt);
        if(hit&&lives<=0){st='over';}
        return !hit;
      }
    }
    return true;
  });
}

let powerups=[],powerupT=8;
function updPowerups(dt){
  powerupT-=dt;
  if(powerupT<=0){
    powerupT=10+Math.random()*8;
    const lane=Math.floor(Math.random()*3);
    // Heal drink only offered while a heart is actually missing
    const kind=(lives<3&&Math.random()<.5)?'heal':'boost';
    powerups.push({lane,x:W+90,y:LY[lane],w:26,h:30,anim:Math.random()*10,kind});
  }
  const spd=effSpeed();
  powerups=powerups.filter(p=>{
    p.x-=spd*dt;p.anim+=dt*3;
    if(p.x<-60)return false;
    const pb=pl.box(),m=6;
    if(pb.x+m<p.x+p.w/2&&pb.x+pb.w-m>p.x-p.w/2&&
       pb.y+m<p.y+p.h/2&&pb.y+pb.h-m>p.y-p.h/2){
      if(p.kind==='heal'){
        lives=Math.min(3,lives+1);
        pl.healT=2.5;
        addFx(p.x,p.y,'heal');
      } else {
        pl.inv=Math.max(pl.inv,8);
        pl.shieldT=8;
        addFx(p.x,p.y,'powerup');
      }
      return false;
    }
    return true;
  });
}

function rrect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);
  cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);
  cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);
  cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);
  cx.arcTo(x,y,x+r,y,r);
  cx.closePath();
}

// ── Weather ───────────────────────────────────────────────
function updWeather(dt){
  weatherTimer-=dt;
  if(weatherTimer<=0){
    weather=weather==='clear'?'rain':'clear';
    weatherTimer=weather==='rain'?(15+Math.random()*20):(20+Math.random()*30);
  }
  // Fade rain intensity
  const target=weather==='rain'?1:0;
  rainIntensity+=(target-rainIntensity)*dt*0.8;
  // Spawn rain drops
  if(rainIntensity>.05){
    const count=Math.floor(rainIntensity*8);
    for(let i=0;i<count;i++){
      rainDrops.push({x:Math.random()*W,y:-10,vy:480+Math.random()*180,vx:-35});
    }
  }
  // Update drops
  rainDrops=rainDrops.filter(d=>{
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    return d.y<H+10;
  });
}

function drawRain(){
  if(rainIntensity<.01)return;
  cx.strokeStyle=`rgba(180,210,240,${rainIntensity*.55})`;
  cx.lineWidth=1;
  rainDrops.forEach(d=>{
    cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.vx*.04,d.y+d.vy*.04);cx.stroke();
  });
  // Overlay tint for overcast sky
  cx.fillStyle=`rgba(60,80,120,${rainIntensity*.22})`;
  cx.fillRect(0,0,W,H);
}

// ── Scene drawing ─────────────────────────────────────────
function drawSky(){
  const ri=rainIntensity;
  // MacRitchie gets a darker, greener, jungle sky
  const isMac=lvl===1;
  const sky0=isMac?'#2a4a20':'#6aafd4';
  const sky1=isMac?'#3a6028':'#a8d4ee';
  const sky2=isMac?'#4a7030':'#cce8f6';
  const s0=lerpCol(sky0,'#2a3a28',ri);
  const s1=lerpCol(sky1,'#384838',ri);
  const s2=lerpCol(sky2,'#485040',ri);
  const g=cx.createLinearGradient(0,0,0,RT);
  g.addColorStop(0,s0);g.addColorStop(.6,s1);g.addColorStop(1,s2);
  cx.fillStyle=g;cx.fillRect(0,0,W,RT);
  // Clouds — thicker and darker when raining
  [
    {ox:0.07,oy:38,sc:1.3},{ox:0.043,oy:65,sc:.85},{ox:0.06,oy:22,sc:1.0}
  ].forEach(cl=>{
    const cx2=((t*W*cl.ox+200)%(W+200))-100;
    cloud(cx2,cl.oy,cl.sc,ri);
  });
}

function lerpCol(a,b,f){
  const p=s=>parseInt(s,16);
  const r1=p(a.slice(1,3)),g1=p(a.slice(3,5)),b1=p(a.slice(5,7));
  const r2=p(b.slice(1,3)),g2=p(b.slice(3,5)),b2=p(b.slice(5,7));
  const r=Math.round(r1+(r2-r1)*f),g=Math.round(g1+(g2-g1)*f),bl=Math.round(b1+(b2-b1)*f);
  return `rgb(${r},${g},${bl})`;
}
function cloud(x,y,s,ri=0){
  const alpha=0.82-ri*0.3;
  const dark=Math.round(ri*80);
  cx.fillStyle=`rgba(${255-dark},${255-dark},${255-dark},${alpha})`;
  cx.beginPath();
  cx.arc(x,y,23*s,0,Math.PI*2);
  cx.arc(x+28*s,y-8*s,18*s,0,Math.PI*2);
  cx.arc(x+52*s,y,20*s,0,Math.PI*2);
  cx.arc(x+24*s,y+6*s,16*s,0,Math.PI*2);
  cx.fill();
}

}

function drawKite(a,tailAng){
  // Kite diamond body
  const cols=['#ee2222','#2266ee','#eebb00','#22bb44','#ee6600'];
  // Pick colour based on anim seed
  const ci=Math.floor(a*0.3)%cols.length;
  const c1=cols[ci], c2=cols[(ci+2)%cols.length];

  // Diamond shape (4 triangles)
  const kw=17,kh=20;
  cx.beginPath();cx.moveTo(0,-kh);cx.lineTo(kw,0);cx.lineTo(0,kh);cx.lineTo(-kw,0);cx.closePath();
  cx.fillStyle=c1;cx.fill();
  // Two-tone split
  cx.beginPath();cx.moveTo(0,-kh);cx.lineTo(kw,0);cx.lineTo(0,kh);cx.closePath();
  cx.fillStyle=c2;cx.fill();
  // Cross spars
  cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(0,-kh);cx.lineTo(0,kh);cx.stroke();
  cx.beginPath();cx.moveTo(-kw,0);cx.lineTo(kw,0);cx.stroke();
  // Outline
  cx.strokeStyle='rgba(0,0,0,.5)';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(0,-kh);cx.lineTo(kw,0);cx.lineTo(0,kh);cx.lineTo(-kw,0);cx.closePath();cx.stroke();

  // String — goes down-right toward the rider (kite is above, string hangs below-left)
  cx.strokeStyle='rgba(80,80,80,.7)';cx.lineWidth=1;
  const sx=Math.sin(tailAng)*8, sy=kh;
  cx.beginPath();cx.moveTo(sx,sy);cx.quadraticCurveTo(sx+20+Math.sin(a)*6,sy+30,sx+38,sy+55);cx.stroke();

  // Tail ribbons (3 little fluttering bows along the tail)
  const ribCols=['#ff6688','#ffcc00','#88ddff'];
  for(let i=0;i<3;i++){
    const f=i/2;
    const rx=sx+20*f+Math.sin(a*.7+i)*5, ry=sy+18+f*28;
    cx.fillStyle=ribCols[i];
    cx.beginPath();cx.ellipse(rx,ry,4,2.5,Math.sin(a+i)*0.6,0,Math.PI*2);cx.fill();

  cx.fillStyle='rgba(0,0,0,.08)';
  cx.beginPath();cx.ellipse(0,kh+60,12,4,0,0,Math.PI*2);cx.fill();
}

function drawOtter(x,y,a,sc){

  cx.quadraticCurveTo(-30,3,-40,-2);
  cx.quadraticCurveTo(-30,9,-14,11);
  cx.closePath();cx.fill();
  // Stubby running legs
  cx.strokeStyle='#4a3620';cx.lineWidth=4;cx.lineCap='round';
  cx.beginPath();cx.moveTo(-8,10);cx.lineTo(-8+run,17);cx.stroke();
  cx.beginPath();cx.moveTo(7,10);cx.lineTo(7-run,17);cx.stroke();

  cx.fillStyle='#6b5238';
  cx.beginPath();cx.ellipse(0,2,20,10,0,0,Math.PI*2);cx.fill();
  // Pale belly patch
  cx.fillStyle='#a8886a';
  cx.beginPath();cx.ellipse(0,7,15,5,0,0,Math.PI*2);cx.fill();
  // Head — rounded, flows into the body, flattened muzzle

  cx.fillStyle='#a8886a';
  cx.beginPath();cx.ellipse(24,1,5,3.4,-.1,0,Math.PI*2);cx.fill();
  // Small round ears
  cx.fillStyle='#5c4530';
  cx.beginPath();cx.arc(15,-9,3,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(23,-10,3,0,Math.PI*2);cx.fill();

// ── Uncle Sim ─────────────────────────────────────────────
function drawUncle(x,y,pa,wob,inv){
  cx.save();cx.translate(x,y);
  if(pl.shieldT>0){
    // Steady golden shield aura from the bubble-tea power-up only —
    // NOT shown for the brief post-hit i-frames, so it never looks like
    // you were "rewarded" right when a heart gets taken away
    const pulse=.5+Math.sin(t*8)*.5;
    const aura=cx.createRadialGradient(0,0,10,0,0,42);
    aura.addColorStop(0,`rgba(255,215,60,${.05+pulse*.12})`);
    aura.addColorStop(.7,`rgba(255,215,60,${.22+pulse*.18})`);
    aura.addColorStop(1,'rgba(255,215,60,0)');
    cx.fillStyle=aura;
    cx.beginPath();cx.arc(0,0,42,0,Math.PI*2);cx.fill();
    cx.strokeStyle=`rgba(255,225,90,${.5+pulse*.4})`;cx.lineWidth=2;
    cx.beginPath();cx.arc(0,0,34,0,Math.PI*2);cx.stroke();
  }
  if(pl.healT>0){
    // Brief pink heart-halo after picking up the 100+ heal drink
    const hp=.5+Math.sin(t*10)*.5;
    const haura=cx.createRadialGradient(0,0,10,0,0,38);
    haura.addColorStop(0,`rgba(255,90,120,${.06+hp*.14})`);
    haura.addColorStop(.7,`rgba(255,90,120,${.25+hp*.2})`);
    haura.addColorStop(1,'rgba(255,90,120,0)');
    cx.fillStyle=haura;
    cx.beginPath();cx.arc(0,0,38,0,Math.PI*2);cx.fill();
    for(let i=0;i<3;i++){
      const ang=t*3+i*(Math.PI*2/3);
      drawHeart(Math.cos(ang)*28,Math.sin(ang)*28-6,4,'#ff4d6d',1);
    }
  }
  if(inv>0&&Math.sin(t*25)<0){cx.restore();return;}
  if(inv>0)cx.globalAlpha=.75;
  if(wob>.01)cx.rotate(Math.sin(t*22)*wob*.1);

  // Shadow
  cx.fillStyle='rgba(0,0,0,.14)';
  cx.beginPath();cx.ellipse(4,30,26,7,0,0,Math.PI*2);cx.fill();

  // ── BIKE ──
  const wx1=-22,wx2=28,wy=22,wr=20;
  // Wheels
  [wx1,wx2].forEach((wx,i)=>{
    cx.strokeStyle=P.bkW;cx.lineWidth=3;
    cx.beginPath();cx.arc(wx,wy,wr,0,Math.PI*2);cx.stroke();
    cx.strokeStyle='#686868';cx.lineWidth=1;
    for(let s=0;s<8;s++){
      const a=pa*(i===0?1:.97)+(s/8)*Math.PI*2;
      cx.beginPath();cx.moveTo(wx,wy);cx.lineTo(wx+Math.cos(a)*(wr-2),wy+Math.sin(a)*(wr-2));cx.stroke();
    }
    // Hub
    cx.fillStyle='#888';cx.beginPath();cx.arc(wx,wy,3,0,Math.PI*2);cx.fill();
  });
  // Tyre wall (subtle)
  cx.strokeStyle='rgba(80,80,80,.5)';cx.lineWidth=1;
  cx.beginPath();cx.arc(wx1,wy,wr-4,0,Math.PI*2);cx.stroke();
  cx.beginPath();cx.arc(wx2,wy,wr-4,0,Math.PI*2);cx.stroke();

  // Frame
  const bb={x:4,y:14},st2={x:-8,y:-12},ht={x:24,y:-10};
  cx.strokeStyle=P.bkF;cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';
  cx.beginPath();
  cx.moveTo(bb.x,bb.y);cx.lineTo(st2.x,st2.y);
  cx.lineTo(ht.x,ht.y);cx.lineTo(bb.x,bb.y);
  cx.moveTo(bb.x,bb.y);cx.lineTo(wx1,wy);
  cx.moveTo(st2.x,st2.y);cx.lineTo(wx1,wy);
  cx.moveTo(ht.x,ht.y);cx.lineTo(wx2,wy);
  cx.stroke();
  // Handlebar
  cx.strokeStyle='#777';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(ht.x,ht.y);cx.lineTo(ht.x+2,ht.y-10);cx.lineTo(ht.x-5,ht.y-10);cx.stroke();
  // Saddle
  cx.fillStyle='#222';cx.beginPath();cx.ellipse(st2.x-2,st2.y-5,11,3.5,-.2,0,Math.PI*2);cx.fill();
  // Pedals + crank
  const pr=8;
  cx.strokeStyle='#888';cx.lineWidth=2;
  cx.beginPath();
  cx.moveTo(bb.x+Math.cos(pa)*pr,bb.y+Math.sin(pa)*pr);
  cx.lineTo(bb.x,bb.y);
  cx.lineTo(bb.x+Math.cos(pa+Math.PI)*pr,bb.y+Math.sin(pa+Math.PI)*pr);
  cx.stroke();
  cx.fillStyle='#555';
  [[pa],[pa+Math.PI]].forEach(([a])=>{
    cx.beginPath();cx.arc(bb.x+Math.cos(a)*pr,bb.y+Math.sin(a)*pr,3.5,0,Math.PI*2);cx.fill();
  });
  cx.strokeStyle='#aaa';cx.lineWidth=1.5;cx.beginPath();cx.arc(bb.x,bb.y,5.5,0,Math.PI*2);cx.stroke();

  // Chain (simplified)
  cx.strokeStyle='rgba(100,100,100,.5)';cx.lineWidth=1.5;cx.setLineDash([2,2]);
  cx.beginPath();cx.moveTo(bb.x,bb.y+5);cx.lineTo(wx1,wy+3);cx.stroke();
  cx.setLineDash([]);

  // ── BODY ──
  // Legs
  const la=pa*.85;
  cx.strokeStyle='#3a3a5a';cx.lineWidth=5;cx.lineCap='round';
  const legP=(side)=>{
    const a=la+(side?Math.PI:0),pr2=11;
    const kx=bb.x+Math.cos(a)*pr2,ky=bb.y+Math.sin(a)*pr2-4;
    cx.beginPath();cx.moveTo(-2,-4);cx.lineTo(kx,ky);
    cx.lineTo(bb.x+Math.cos(pa+(side?Math.PI:0))*pr,bb.y+Math.sin(pa+(side?Math.PI:0))*pr);
    cx.stroke();
  };
  legP(0);legP(1);

  // Torso (forward lean)
  cx.fillStyle=P.shirt;cx.beginPath();cx.ellipse(-1,-12,9,14,-.25,0,Math.PI*2);cx.fill();
  // Arm to bar
  cx.strokeStyle=P.skin;cx.lineWidth=5;cx.lineCap='round';
  cx.beginPath();cx.moveTo(6,-22);cx.quadraticCurveTo(18,-18,ht.x-2,ht.y-9);cx.stroke();

  // ── THULE BAG ──
  const bx=-17,by=-24;
  cx.fillStyle=P.bag;rrect(bx,by,18,20,3);cx.fill();
  // Bag strap
  cx.strokeStyle=P.bagS;cx.lineWidth=2;
  cx.beginPath();cx.moveTo(-7,-32);cx.lineTo(bx+9,by);cx.stroke();
  // Thule stripe
  cx.fillStyle=P.bagS;cx.fillRect(bx+1,by+7,16,2.5);
  // Clasp
  cx.fillStyle='#333';cx.fillRect(bx+5,by+15,8,3);
  // "THULE" micro-text
  cx.fillStyle='rgba(255,255,255,.5)';cx.font='5px Arial';cx.textAlign='center';
  cx.fillText('THULE',bx+9,by+5);cx.textAlign='left';

  // ── HEAD ──
  const hx=6,hy=-38;
  cx.fillStyle=P.skin;cx.fillRect(hx-4,hy+13,8,9);
  cx.fillStyle=P.skin;cx.beginPath();cx.arc(hx,hy,13,0,Math.PI*2);cx.fill();
  // Ear
  cx.fillStyle=P.skinD;cx.beginPath();cx.arc(hx-12,hy+1,3.5,0,Math.PI*2);cx.fill();

  // ── HAIR (swept pompadour) ──
  cx.fillStyle=P.hair;
  // Undercut sides
  cx.beginPath();cx.arc(hx-1,hy+2,13,Math.PI*.75,Math.PI*1.85);cx.fill();
  // Pompadour volume
  cx.beginPath();
  cx.moveTo(hx-10,hy-7);
  cx.quadraticCurveTo(hx-2,hy-26,hx+11,hy-15);
  cx.quadraticCurveTo(hx+13,hy-8,hx+4,hy-4);
  cx.quadraticCurveTo(hx,hy-14,hx-8,hy-7);
  cx.fill();
  // Top sweep
  cx.beginPath();
  cx.moveTo(hx-9,hy-9);
  cx.quadraticCurveTo(hx+3,hy-27,hx+10,hy-13);
  cx.quadraticCurveTo(hx+6,hy-7,hx,hy-11);
  cx.fill();
  // Shine
  cx.fillStyle='rgba(80,60,50,.3)';
  cx.beginPath();cx.ellipse(hx+3,hy-16,3,7,-.5,0,Math.PI*2);cx.fill();

  // ── GLASSES (rectangular, thick frames) ──
  const gy=hy+2;
  cx.strokeStyle='#111';cx.lineWidth=2.2;cx.fillStyle='rgba(100,160,220,.15)';
  // Left lens
  rrect(hx-12,gy-4,10,7,1.5);cx.fill();cx.stroke();
  // Right lens
  rrect(hx,gy-4,10,7,1.5);cx.fill();cx.stroke();
  // Bridge
  cx.beginPath();cx.moveTo(hx-2,gy-.5);cx.lineTo(hx,gy-.5);cx.stroke();
  // Temples
  cx.beginPath();cx.moveTo(hx-12,gy-.5);cx.lineTo(hx-15,gy-.5);cx.stroke();
  cx.beginPath();cx.moveTo(hx+10,gy-.5);cx.lineTo(hx+13,gy-.5);cx.stroke();

  // Nose
  cx.fillStyle=P.skinD;cx.beginPath();cx.arc(hx+7,hy+4,2.8,0,Math.PI*2);cx.fill();
  // Stubble
  cx.fillStyle='rgba(90,60,45,.45)';cx.beginPath();cx.arc(hx+1,hy+8,5.5,0,Math.PI);cx.fill();
  // Subtle smile
  cx.strokeStyle='rgba(90,60,45,.4)';cx.lineWidth=1.5;
  cx.beginPath();cx.arc(hx+3,hy+4,4,.3,Math.PI-.3);cx.stroke();

  cx.globalAlpha=1;cx.restore();
}

function drawStar(x,y,r){
  cx.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2;
    const ri=i%2===0?r:r*.4;
    i===0?cx.moveTo(x+Math.cos(a)*ri,y+Math.sin(a)*ri):cx.lineTo(x+Math.cos(a)*ri,y+Math.sin(a)*ri);
  }
  cx.closePath();cx.fill();
}

function heartPath(x,y,r){
  cx.beginPath();
  cx.moveTo(x,y+r*.3);
  cx.bezierCurveTo(x,y-r*.5,x-r*1.2,y-r*.5,x-r*1.2,y+r*.2);
  cx.bezierCurveTo(x-r*1.2,y+r*.8,x,y+r*1.4,x,y+r*1.5);
  cx.bezierCurveTo(x,y+r*1.4,x+r*1.2,y+r*.8,x+r*1.2,y+r*.2);
  cx.bezierCurveTo(x+r*1.2,y-r*.5,x,y-r*.5,x,y+r*.3);
}
function drawHeart(x,y,r,col,fill=1){
  cx.save();
  cx.globalAlpha=.25;cx.fillStyle=col;
  heartPath(x,y,r);cx.fill();
  if(fill>0){
    cx.beginPath();cx.rect(x-r*1.3,y-r*1.7,r*2.6*Math.min(1,fill),r*3.3);cx.clip();
    cx.globalAlpha=1;cx.fillStyle=col;
    heartPath(x,y,r);cx.fill();
  }
  cx.restore();
}

function drawMiniCycle(x,y){
  cx.save();cx.translate(x,y);
  cx.strokeStyle=P.acc;cx.lineWidth=1.5;cx.lineCap='round';
  // Wheels
  cx.beginPath();cx.arc(-7,2,5,0,Math.PI*2);cx.stroke();
  cx.beginPath();cx.arc(7,2,5,0,Math.PI*2);cx.stroke();
  // Frame
  cx.beginPath();cx.moveTo(1,-3);cx.lineTo(-3,2);cx.lineTo(-7,2);cx.stroke();
  cx.beginPath();cx.moveTo(1,-3);cx.lineTo(7,2);cx.stroke();
  cx.beginPath();cx.moveTo(-1,-6);cx.lineTo(1,-3);cx.stroke();
  // Rider dot
  cx.fillStyle=P.acc;cx.beginPath();cx.arc(0,-7,3,0,Math.PI*2);cx.fill();
  cx.restore();
}

// ── HUD ───────────────────────────────────────────────────
function drawHUD(){
  const lv=DESTS[lvl],dtg=Math.max(0,lv.d-dist),prog=Math.min(1,dist/lv.d);
  // Top bar
  cx.fillStyle=P.uiBg;cx.fillRect(0,0,W,46);
  const spd=Math.round((gSpeed+pl.velM*45)*.065);
  cx.fillStyle=P.acc;cx.font='bold 24px Courier New';cx.fillText(spd+'',18,32);
  cx.fillStyle=P.wht;cx.font='10px Courier New';cx.fillText('km/h',54,32);
  // Hearts (drawn as canvas shapes — no Unicode; half-hearts for poop hits)
  for(let i=0;i<3;i++){
    drawHeart(W/2-22+i*26,20,9,P.red,Math.max(0,Math.min(1,lives-i)));
  }
  // Distance
  cx.fillStyle=P.grn;cx.font='bold 18px Courier New';cx.textAlign='right';
  cx.fillText(Math.floor(dist)+'m',W-18,30);cx.textAlign='left';
  // Shield power-up indicator — bold pulsing banner + countdown, hard to miss.
  // Gated on shieldT (bubble tea only), not the brief post-hit i-frames, so it
  // never falsely reads as a reward at the same moment a heart is lost.
  if(pl.shieldT>0){
    const pulse=.5+Math.sin(t*8)*.5;
    const bw=190,bh=22,bx=W/2-bw/2,by=50;
    cx.fillStyle=`rgba(255,190,40,${.6+pulse*.25})`;
    rrect(bx,by,bw,bh,11);cx.fill();
    cx.strokeStyle=`rgba(255,235,150,${.65+pulse*.35})`;cx.lineWidth=2;
    rrect(bx,by,bw,bh,11);cx.stroke();
    // Small drawn star icon (no Unicode — renders consistently everywhere)
    cx.save();cx.translate(bx+16,by+bh/2);
    cx.fillStyle='#2a1a00';cx.beginPath();
    for(let i=0;i<5;i++){
      const ang=-Math.PI/2+i*(Math.PI*2/5),ang2=ang+Math.PI/5;
      cx.lineTo(Math.cos(ang)*7,Math.sin(ang)*7);
      cx.lineTo(Math.cos(ang2)*3,Math.sin(ang2)*3);
    }
    cx.closePath();cx.fill();
    cx.restore();
    cx.fillStyle='#2a1a00';cx.font='bold 13px Courier New';cx.textAlign='center';
    cx.fillText('INVINCIBLE '+pl.shieldT.toFixed(1)+'s',W/2+8,by+bh-6);
    cx.textAlign='left';
  }
  // Bottom bar
  cx.fillStyle=P.uiBg;cx.fillRect(0,H-38,W,38);
  cx.fillStyle=P.wht;cx.font='11px Courier New';
  cx.fillText('→ '+lv.name,14,H-18);
  cx.textAlign='right';cx.fillText(Math.ceil(dtg)+'m to go',W-14,H-18);cx.textAlign='left';
  // Progress bar
  const bx=180,bw=W-360,bY=H-28,bh=10;
  cx.fillStyle='rgba(255,255,255,.1)';rrect(bx,bY,bw,bh,5);cx.fill();
  if(prog>0){
    const pg=cx.createLinearGradient(bx,0,bx+bw,0);
    pg.addColorStop(0,'#3aad3a');pg.addColorStop(1,'#88ff88');
    cx.fillStyle=pg;rrect(bx,bY,bw*prog,bh,5);cx.fill();
  }
  // Bike icon on progress (drawn — no Unicode)
  const bix=bx+bw*prog;
  drawMiniCycle(bix,bY+3);
  // Boost/brake status
  if(pl.velM>.2){
    cx.fillStyle=P.acc;cx.font='bold 11px Courier New';
    const bar='='.repeat(Math.round(pl.velM*8));
    cx.fillText('['+bar+'] BOOST',70,32);
  }
  if(pl.velM<-.15){cx.fillStyle=P.red;cx.font='bold 11px Courier New';cx.fillText('[ BRAKING ]',70,32);}
  // Weather warning
  if(rainIntensity>.3){
    const pulse=.7+Math.sin(t*6)*.3;
    cx.fillStyle=`rgba(100,160,220,${pulse})`;
    cx.font='bold 13px Courier New';cx.textAlign='center';
    cx.fillText(rainIntensity>.7?'** RAIN — PUDDLES SLIPPERY! **':'Rain coming...', W/2, H-42);
    cx.textAlign='left';
    if(pl.velM>.4){
      cx.fillStyle=`rgba(255,80,80,${pulse})`;
      cx.font='bold 14px Courier New';cx.textAlign='center';
      cx.fillText('!! SLOW DOWN — DANGER !!',W/2,H-58);
      cx.textAlign='left';
    }
  }
  // Hit flash
  if(flash>0){
    cx.fillStyle=`rgba(255,40,40,${flash*.38})`;cx.fillRect(0,0,W,H);
  }
}

    rrect(-88,-34,44,68,pr2);cx.stroke();
    cx.fillStyle='rgba(255,255,255,0.35)';rrect(-88,-34,44,68,pr2);cx.fill();
    cx.fillStyle='rgba(255,255,255,0.7)';cx.beginPath();cx.arc(-66,26,4,0,Math.PI*2);cx.fill();
    // Arrow (curved, animated nudge)

    cx.strokeStyle='#4acd4a';cx.lineWidth=4;cx.lineCap='round';
    cx.beginPath();cx.arc(0,0,32,Math.PI+.4+nudge,-Math.PI/2-.3+nudge,false);cx.stroke();
    // Arrowhead
    const aang=-Math.PI/2-.3+nudge;
    const atx=Math.cos(aang)*32,aty=Math.sin(aang)*32;
    cx.beginPath();
    cx.moveTo(atx,aty);
    cx.lineTo(atx+Math.cos(aang+Math.PI/2)*10,aty+Math.sin(aang+Math.PI/2)*10);
    cx.lineTo(atx+Math.cos(aang-.6)*12,aty+Math.sin(aang-.6)*12);

    cx.strokeStyle='#4acd4a';cx.lineWidth=3;

    cx.fillStyle='rgba(74,205,74,0.2)';rrect(48,-22,68,44,pr2);cx.fill();

}

}

let confetti=[];
function spawnConfetti(){
  if(confetti.length>0)return;
  const cols=['#ff4444','#ffcc00','#44dd44','#44aaff','#ff88cc','#ffffff'];
  for(let i=0;i<80;i++){
    confetti.push({
      x:Math.random()*W,y:-10-Math.random()*200,
      vy:60+Math.random()*80,vx:(Math.random()-.5)*60,
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*6,
      w:6+Math.random()*8,h:4+Math.random()*5,
      col:cols[Math.floor(Math.random()*cols.length)]
    });
  }
}

function drawWin(){
  if(confetti.length===0)spawnConfetti();
  // Update and draw confetti
  confetti.forEach(c=>{
    c.y+=c.vy*dt;c.x+=c.vx*dt;c.rot+=c.rotV*dt;
    if(c.y>H+20)c.y=-10;
    cx.save();cx.translate(c.x,c.y);cx.rotate(c.rot);
    cx.fillStyle=c.col;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    cx.restore();
  });

  // Big overlay panel
  cx.fillStyle='rgba(5,35,10,.88)';
  rrect(W/2-290,80,580,320,18);cx.fill();
  cx.strokeStyle=P.grn;cx.lineWidth=3;
  rrect(W/2-290,80,580,320,18);cx.stroke();

  cx.textAlign='center';
  // Flashing big banner
  const pulse=.7+Math.sin(t*6)*.3;
  cx.fillStyle=`rgba(80,255,80,${pulse})`;
  cx.font='bold 46px Impact, Arial Narrow';
  cx.fillText('DESTINATION REACHED!',W/2,148);

  // Stars (drawn — no Unicode)
  cx.fillStyle='#ffcc00';
  for(let i=0;i<5;i++) drawStar(W/2-80+i*40,172,8);

  // Level name — big and prominent
  cx.fillStyle='#ffffff';cx.font='bold 28px Courier New';
  cx.fillText(DESTS[lvl].name,W/2,220);

  // Stats
  cx.fillStyle='#aaddaa';cx.font='14px Courier New';
  cx.fillText('Distance: '+Math.floor(dist)+'m   Score: '+score,W/2,258);

  // Next level info
  if(lvl<DESTS.length-1){
    cx.fillStyle='#66ee88';cx.font='bold 15px Courier New';
    cx.fillText('NEXT STOP: '+DESTS[lvl+1].name,W/2,295);
    const dif=['Easy','Moderate','Hard','Extreme'][lvl+1]||'Hard';
    cx.fillStyle='#ffcc44';cx.font='13px Courier New';
    cx.fillText('Difficulty: '+dif,W/2,315);
  }else{
    cx.fillStyle=P.acc;cx.font='bold 16px Courier New';
    cx.fillText('ALL ROUTES COMPLETE!',W/2,295);
    cx.fillStyle='#ffcc44';cx.font='14px Courier New';
    cx.fillText('Legendary Cyclist Uncle Sim!',W/2,318);
  }

  if(Math.sin(t*3)>0){
    cx.fillStyle='#ffffff';cx.font='bold 16px Courier New';
    cx.fillText('[ PRESS SPACE TO CONTINUE ]',W/2,370);
  }
  cx.textAlign='left';
}

// ── Game control ──────────────────────────────────────────
const LEVEL_BSPEEDS=[180,240,300,360];
function startGame(){
  st='playing';lives=3;dist=0;score=0;
  bSpeed=LEVEL_BSPEEDS[lvl]||180;
  gSpeed=bSpeed;obs=[];fx=[];spawnT=0;pigeons=[];pigeonT=6+Math.random()*4;powerups=[];powerupT=6+Math.random()*5;
  spawnI=Math.max(.7,2.8-lvl*.4); // harder levels spawn faster
  flash=0;env_x=0;confetti=[];
  weather='clear';weatherTimer=20+Math.random()*20;rainIntensity=0;rainDrops=[];
  pl.reset();initEnv();
}
function nextLvl(){
  if(lvl<DESTS.length-1){lvl++;startGame();}
  else{lvl=0;startGame();}
}

// ── Main loop ─────────────────────────────────────────────
function drawSpeedLines(){
  if(pl.velM<.3)return;
  const alpha=((pl.velM-.3)/.6)*.35;
  cx.strokeStyle=`rgba(255,255,255,${alpha})`;
  cx.lineWidth=1;
  for(let i=0;i<18;i++){
    const y=RT+Math.random()*(RB-RT);
    const len=40+Math.random()*80;
    const x=PX+30+Math.random()*200;
    cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+len,y);cx.stroke();
  }
}

function frame(ts){
  dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;t+=dt;
  // Flash always decays (fixes game-over stuck red screen)
  flash=Math.max(0,flash-dt*3.5);
  if(st==='playing'){
    gSpeed=Math.min(480,bSpeed+dist*.05);
    spawnI=Math.max(.5,2.4-dist*.0005-lvl*.35);
    const spd=effSpeed();
    dist+=spd*dt*.24;
    score=Math.floor(dist);
    if(dist>=DESTS[lvl].d){st='win';return requestAnimationFrame(frame);}
    pl.update(dt);
    updEnv(dt);
    updWeather(dt);
    spawnT-=dt;
    if(spawnT<=0){spawnObs();spawnT=spawnI+(Math.random()-.5)*.7;}
    updObs(dt);
    updPigeons(dt);
    updPowerups(dt);
    updFx(dt);
  }
  // Draw
  cx.clearRect(0,0,W,H);
  if(st==='title'){drawTitle();}
  else{
    drawSky();
    if(lvl===1)drawForestBg(); else if(lvl===3)drawBeachBg(); else drawHDB();
    drawTrees();drawLamps();drawRoad();drawCanal();
    drawPigeons();
    obs.forEach(o=>{if(o.x>PX)drawObs(o);});
    drawPowerups();
    drawUncle(PX,pl.y+pl.hopY(),pl.pedA,pl.wob,pl.inv);
    obs.forEach(o=>{if(o.x<=PX)drawObs(o);});
    drawSpeedLines();
    drawRain();
    drawFx();drawHUD();
    if(st==='over')drawOver();
    if(st==='win')drawWin();
  }
  requestAnimationFrame(frame);
}
initEnv();
requestAnimationFrame(frame);
</script>
